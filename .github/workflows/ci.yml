name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --require-hashes -r tests/requirements.txt
      # Several tests shell out to these. Without them the tests do not skip --
      # they FAIL, and they had been failing on every matrix job since the tools
      # were only ever installed in the separate lint/shellcheck jobs:
      # test_command_bash_parse (5 tests) needs shellcheck,
      # test_fleet_skill_phase_a::test_the_ops_engine_is_actually_clean needs ruff.
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install ruff
        run: pip install ruff
      - name: Run the full test suite
        run: python -m pytest tests/ -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      # Full history: the differential gate below resolves its baseline from the merge base
      # with main, and a shallow clone would leave it comparing HEAD against itself.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --require-hashes -r tests/requirements.txt
      # This job runs the SAME suite as `test`, so it needs the same binaries. Adding
      # them to `test` alone left this job failing on `FileNotFoundError: 'ruff'` --
      # the identical defect, one job over, found only by reading CI again.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install ruff
        run: pip install ruff
      # PR-only, by construction. These three gates ask "does THIS change turn a
      # REJECT into an ALLOW, relative to main" -- `--baseline auto` resolves the
      # merge-base with main, which ON main is HEAD itself. The gate then reports
      # `SKIP: baseline resolves to HEAD - nothing to compare` and `--require-baseline`
      # correctly turns that skip into an error, so every push to main has failed this
      # job since at least 2026-08-23. The check is not being weakened: it already ran,
      # meaningfully, on the pull request that introduced the change. A permanently red
      # main is a gate nobody reads.
      - name: No change may turn a REJECT into an ALLOW
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-validator-differential.py --baseline auto --max-len 3 --require-baseline
      # The same rule for the OTHER deny-decision in the repo. The guard that decides
      # whether an ops config may delete a file had no differential gate, and the first
      # change to widen it passed CI green.
      - name: No change may unprotect a file without disclosing it
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-protected-differential.py --baseline auto --require-baseline
      # The THIRD deny-shaped decision: the file-guard classifier. It is shell, so the
      # gate runs it as a subprocess on both sides. It had no differential gate at all
      # until the day its first widening was proposed.
      - name: No change may un-flag a secret without disclosing it
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-fileguard-differential.py --baseline auto --require-baseline
      # Executes fuzzed shell payloads on purpose - contained (empty PATH, shadowed dangerous
      # commands, temp cwd, per-child ulimits, refused fork-bomb shapes) and on an ephemeral
      # runner. Shorter corpus than the differential gate: this one spawns a shell per payload.
      - name: bash must not reach a blocked command the validator allowed
        run: python3 scripts/check-validator-vs-bash.py --max-len 2 --allow-execution
      - name: Enforce security-module coverage
        run: |
          python -m pytest tests/ -q \
            --cov=src/claudekit/security \
            --cov-report=term-missing \
            --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install ruff mypy
      - name: ruff
        run: ruff check src/ tests/ scripts/ .claude/operations/scripts/
      - name: codex-mirror-drift
        run: python3 scripts/gen-agents-mirror.py --check
      - name: mypy
        # Bare `mypy` so CI reads mypy.ini/pyproject like a developer does. The
        # narrower `mypy src/claudekit` skipped .claude/operations/scripts entirely,
        # so three annotation errors in fleet-sync.py were invisible to CI as well
        # as to the DoD sweep that only covered src/.
        run: mypy

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # gen-plan-index.py derives `executed` from `Plan-Id:` commit trailers, so a
          # shallow clone would see no trailers and quietly derive `approved` instead —
          # disagreeing with a developer's tree. Full history is load-bearing here.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Component counts match the filesystem
        run: python3 scripts/gen-docs.py --check
      - name: Model policy matches agent frontmatter
        run: python3 scripts/gen-model-policy.py --check
      - name: Always-on context floor within budget
        run: python3 scripts/check-context-floor.py --check
      - name: Plan lifecycle index matches derived state
        run: python3 scripts/gen-plan-index.py --check
      - name: Every path an ops config writes is named in its plan
        run: python3 scripts/check-plan-artifacts.py --check
      - name: Prompt corpus lint (command budget, skill tool grants, triggers)
        run: PYTHONPATH=src python3 -m claudekit.cli.main lint

  dangling-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Every hook referenced in settings.json exists
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          text = Path(".claude/settings.json").read_text()
          json.loads(text)  # must be valid JSON
          refs = set(re.findall(r'\.claude/hooks/([A-Za-z0-9_-]+\.sh)', text))
          missing = [h for h in sorted(refs) if not Path(".claude/hooks", h).exists()]
          if missing:
              print("Dangling hook references in settings.json:", missing)
              sys.exit(1)
          print(f"OK: all {len(refs)} referenced hooks exist.")
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Check install script
        run: shellcheck install.sh
      - name: Check hook scripts
        run: |
          for f in .claude/hooks/*.sh; do
            echo "Checking $f..."
            shellcheck "$f"
          done

  permission-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: No --dangerously-skip-permissions in shipped assets
        run: |
          # Match actual `claude ... --dangerously-skip-permissions` invocations (not prose
          # that documents the ban). Search shipped assets only, not plan scratch.
          # The single permitted exception is a documented opt-in in loop-start.md.
          hits=$(grep -rnE 'claude[^|]*--dangerously-skip-permissions' \
            .claude/commands .claude/agents .claude/skills .claude/hooks templates \
            2>/dev/null | grep -v "commands/loop-start.md" || true)
          if [ -n "$hits" ]; then
            echo "Forbidden --dangerously-skip-permissions invocation found:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no unsanctioned permission bypass."

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify operations scripts
        run: |
          test -f .claude/operations/scripts/validate-config-json.py
          test -f .claude/operations/scripts/execute-json-ops.py
          test -f .claude/operations/scripts/restore-backup.py
          test -f .claude/operations/scripts/shared.py
          test -f .claude/operations/scripts/operations-schema.json
          echo "All operations scripts present"
      - name: Test install script help
        run: bash install.sh --help

  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Registry matches the filesystem (skills + agents)
        run: python3 scripts/gen-registry.py --check

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install wheel in a clean venv and run console scripts
        run: |
          python -m venv /tmp/ck-smoke
          /tmp/ck-smoke/bin/pip install --upgrade pip
          /tmp/ck-smoke/bin/pip install dist/*.whl
          /tmp/ck-smoke/bin/claudekit --version
          /tmp/ck-smoke/bin/ck --help
      - name: Standalone init+doctor from the wheel (no checkout, no CLAUDEKIT_HOME)
        run: |
          target="$(mktemp -d)"
          # Run from an unrelated dir so only the wheel-bundled assets are found.
          cd /tmp
          env -u CLAUDEKIT_HOME /tmp/ck-smoke/bin/claudekit init "$target" --full --yes
          cd "$target"
          /tmp/ck-smoke/bin/claudekit doctor
          /tmp/ck-smoke/bin/claudekit diff

  install-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: install.sh into a fresh project, then run doctor
        run: |
          target="$(mktemp -d)"
          bash install.sh "$target" --full --yes
          cd "$target"
          claudekit doctor

  supply-chain-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Every workflow action is SHA-pinned
        run: |
          # A mutable tag ref (@v4, @main) lets a compromised action release run
          # in CI with the repo token. Require a full 40-hex commit SHA everywhere;
          # the trailing "# vX.Y.Z" comment is for humans and Dependabot.
          unpinned=$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "Unpinned action refs (pin to a full commit SHA + '# vX.Y.Z' comment):"
            echo "$unpinned"
            exit 1
          fi
          echo "OK: every uses: ref is SHA-pinned."
      - name: MCP template carries no floating versions
        run: |
          # npx @pkg@latest fetches and executes whatever was published last.
          # Pins are the only integrity control we have over that stream.
          floating=$(grep -rn "@latest" templates/mcp/ || true)
          if [ -n "$floating" ]; then
            echo "Floating @latest ref under templates/mcp/ (pin an exact version):"
            echo "$floating"
            exit 1
          fi
          echo "OK: templates/mcp/ carries no @latest refs."
