name: Release

# Publishing to PyPI uses Trusted Publishing (OIDC) — no API token is stored.
# ONE-TIME SETUP on PyPI before the first release:
#   PyPI -> project "claude-kit" -> Publishing -> add a GitHub trusted publisher:
#     owner: OmarMokhtar-Saad, repo: claudekit,
#     workflow: release.yml, environment: pypi
# (For the very first upload of a brand-new project name, use "pending publisher".)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --require-hashes -r tests/requirements.txt

      # The suite shells out to these. Their absence here failed the v3.1.0 release at
      # the test step -- correctly, but for a harness reason rather than a real one.
      # ci.yml's `test` and `coverage` jobs were fixed first and this one was missed,
      # because the jobs were enumerated from ci.yml alone. Both workflows run pytest.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Pinned: this job holds a PyPI OIDC token (id-token: write, environment: pypi),
      # so an unpinned install would run unreviewed code beside publishing rights.
      # tests/requirements.txt is already hash-pinned for exactly this reason; ruff
      # was the gap. Pinned identically in ci.yml so lint cannot differ by version.
      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run the full test suite
        run: python -m pytest tests/ -v

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # dist/ holds claude_kit-<version>.{whl,tar.gz}
          print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/*
