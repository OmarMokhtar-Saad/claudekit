version: 2
updates:
  # Keep GitHub Actions SHA-pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python test/build dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Hash-pinned test lock (tests/requirements.in -> tests/requirements.txt).
  # Dependabot bumps the pin; if a PR arrives without --hash lines, regenerate
  # the lock per the procedure documented in that file's header.
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
