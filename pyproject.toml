[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-kit"
version = "2.1.0"
description = "Production-grade multi-agent orchestration system for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Omar Mokhtar", email = "omar@claudekit.dev"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
validation = ["jsonschema>=4"]
dev = ["pytest", "pytest-timeout", "pytest-cov", "coverage", "ruff", "mypy", "jsonschema>=4"]

[project.scripts]
claudekit = "claudekit.cli.main:main"
ck = "claudekit.cli.main:main"

[project.urls]
Homepage = "https://github.com/OmarMokhtar-Saad/claudekit"
Repository = "https://github.com/OmarMokhtar-Saad/claudekit"
Documentation = "https://github.com/OmarMokhtar-Saad/claudekit/tree/main/docs"
Issues = "https://github.com/OmarMokhtar-Saad/claudekit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".claude", "templates", "examples", "i18n"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled leniently; docs/tables run long

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
files = ["src/claudekit", ".claude/operations/scripts"]
# Without this, mypy SKIPS the body of every unannotated function -- a large blind spot
# in a repo whose DoD gate is `mypy`. Measured: enabling it surfaced 3 errors, no more.
check_untyped_defs = true

[[tool.mypy.overrides]]
# TICKETED FOLLOW-UP (owner-gated, .ai/BACKLOG.md P0.5): src/claudekit/cli/main.py:581
# needs annotations on `identical` and `differs` in the manifest-diff helper. That file
# is owned by a parallel workstream in this batch, so it is scoped out here rather than
# edited under two owners. Remove this override once those two annotations land; it is
# the only thing standing between this repo and check_untyped_defs everywhere.
module = "claudekit.cli.main"
check_untyped_defs = false
